name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install test dependencies
        run: python -m pip install -U -r requirements.txt aiohttp
      - name: Smart asset checks
        run: |
          python tests/dependency_policy_checks.py
          python tests/smart_asset_checks.py
          python tests/integration_checks.py
          python tests/xet_policy_checks.py
          python tests/frontend_contract_checks.py
      - name: Python syntax
        run: python -m compileall -q __init__.py nodes tests
      - name: Frontend syntax
        run: node --check js/downloader.js
