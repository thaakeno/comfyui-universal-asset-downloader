name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install test dependencies
        run: python -m pip install -U pytest requests aiohttp
      - name: Python tests
        run: pytest -q
      - name: Python syntax
        run: python -m compileall -q __init__.py nodes
      - name: Frontend syntax
        run: node --check js/downloader.js
