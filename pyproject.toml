[project]
name = "comfyui-universal-asset-downloader"
description = "A metadata-aware, verified model asset installer for ComfyUI with Xet-accelerated Hugging Face downloads and Civitai analysis."
version = "2.1.1"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "requests>=2.31,<3",
  "huggingface_hub>=0.36.2,<2",
  "hf_xet>=1.5.2,<2",
]
classifiers = [
  "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/thaakeno/comfyui-universal-asset-downloader"
Documentation = "https://github.com/thaakeno/comfyui-universal-asset-downloader#readme"
"Bug Tracker" = "https://github.com/thaakeno/comfyui-universal-asset-downloader/issues"

[tool.comfy]
PublisherId = "thaakeno"
DisplayName = "Universal Asset Downloader"
Icon = ""
